<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trích Xuất Vector Face ID - Mobile</title>
    <!-- Tải thư viện face-api.js từ CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background-color: #0d1117; color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            padding: 15px;
        }
        .box {
            background: #161b22; padding: 20px; border-radius: 16px;
            border: 1px solid #30363d; width: 100%; max-width: 450px; text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h2 { color: #58a6ff; margin-top: 0; font-size: 1.25rem; }
        #webcam-container {
            width: 100%; height: 280px; background: #000;
            border-radius: 12px; overflow: hidden; margin-bottom: 15px;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        /* Lật gương camera trước */
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .btn {
            background: #238636; color: white; border: none; padding: 14px;
            width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer;
            font-size: 16px; transition: 0.2s; margin-bottom: 10px; display: block;
        }
        .btn:active { opacity: 0.8; }
        .btn-copy { background: #1f6feb; display: none; }
        .btn:disabled { background: #30363d; cursor: not-allowed; opacity: 0.5; }
        #msg { margin-bottom: 12px; font-weight: bold; font-size: 14px; min-height: 20px; line-height: 1.4; }
        textarea {
            width: 100%; height: 120px; background: #0d1117; border: 1px solid #30363d;
            color: #7ee787; font-family: monospace; font-size: 11px; padding: 10px;
            border-radius: 8px; resize: none; outline: none; display: none; margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>🎯 TRÍCH XUẤT VECTOR FACE ID</h2>
        <div id="msg">⏳ Đang khởi tạo Camera & AI...</div>

        <div id="webcam-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <button class="btn" id="btn-scan" onclick="getFaceVector()" disabled>📷 Quét & In Vector Ra Màn Hình</button>
        <button class="btn btn-copy" id="btn-copy" onclick="copyVector()">📋 Copy Mảng Vector (JSON)</button>

        <textarea id="output" readonly placeholder="Mảng 128 số vector sẽ xuất hiện ở đây..."></textarea>
    </div>

    <script>
        async function loadModels() {
            const msg = document.getElementById('msg');
            try {
                msg.style.color = '#58a6ff';
                msg.innerText = 'Đang tải AI mô hình nhẹ (Mobile)...';

                const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
                
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                return true;
            } catch (err) {
                msg.style.color = '#f85149';
                msg.innerText = 'Lỗi tải mô hình: ' + err.message;
                return false;
            }
        }

        async function init() {
            const msg = document.getElementById('msg');
            const btnScan = document.getElementById('btn-scan');
            const video = document.getElementById('webcam');

            const modelsLoaded = await loadModels();
            if (!modelsLoaded) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });
                video.srcObject = stream;

                video.onloadeddata = () => {
                    btnScan.disabled = false;
                    msg.style.color = '#3fb950';
                    msg.innerText = 'AI & Camera sẵn sàng! Bấm quét nha.';
                };

            } catch (err) {
                msg.style.color = '#f85149';
                msg.innerText = 'Lỗi camera: ' + (err.message || err);
            }
        }

        async function getFaceVector() {
            const video = document.getElementById('webcam');
            const msg = document.getElementById('msg');
            const btnScan = document.getElementById('btn-scan');
            const output = document.getElementById('output');
            const btnCopy = document.getElementById('btn-copy');

            try {
                btnScan.disabled = true;
                msg.style.color = '#58a6ff';
                msg.innerText = '🔍 Đang phân tích khuôn mặt...';

                // Đã sửa thành TinyFaceDetectorOptions
                const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
                const detection = await faceapi.detectSingleFace(video, options)
                                            .withFaceLandmarks()
                                            .withFaceDescriptor();

                if (!detection) {
                    msg.style.color = '#f85149';
                    msg.innerText = '❌ Không tìm thấy mặt! Thử lại nha bro.';
                    btnScan.disabled = false;
                    return;
                }

                const vectorArray = Array.from(detection.descriptor);

                output.style.display = 'block';
                btnCopy.style.display = 'block';
                output.value = JSON.stringify(vectorArray);

                msg.style.color = '#3fb950';
                msg.innerText = `✅ Đã trích xuất xong ${vectorArray.length} chỉ số Vector!`;
                btnScan.disabled = false;

            } catch (err) {
                msg.style.color = '#f85149';
                msg.innerText = 'Lỗi: ' + err.message;
                btnScan.disabled = false;
            }
        }

        async function copyVector() {
            const output = document.getElementById('output');
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(output.value);
                } else {
                    output.select();
                    document.execCommand('copy');
                }
                alert('📋 Đã copy mảng Vector rồi nha!');
            } catch (err) {
                alert('Không copy được, ông tự bôi đen copy trong ô chat nha.');
            }
        }

        window.onload = init;
    </script>
</body>

</html>
